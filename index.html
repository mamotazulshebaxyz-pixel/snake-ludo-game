<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>সাপ - সিঁড়ি</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>সাপ - সিঁড়ি</h1>
  
  <div class="setup">
    <label>প্লেয়ার সংখ্যা: </label>
    <select id="player-count" onchange="resetGame()">
      <option value="2">২ জন</option>
      <option value="3">৩ জন</option>
      <option value="4">৪ জন</option>
    </select>
  </div>

  <div class="main-wrapper">
    <!-- প্লেয়ার ১ -->
    <div class="player-slot slot-0">
      <div class="p-header"><span class="color-dot p-0"></span><span class="p-name p1-c">প্লেয়ার ১</span></div>
      <div class="dice-btn" id="btn-p0" onclick="rollDice(0)">
        <span id="dice-val-0">1</span>
      </div>
    </div>

    <div class="board-container">
      <div id="board"></div>
      <svg id="svg-layer"></svg>
      <div id="players-layer"></div>
    </div>

    <!-- প্লেয়ার ২ -->
    <div class="player-slot slot-1">
      <div class="p-header"><span class="color-dot p-1"></span><span class="p-name p2-c">প্লেয়ার ২</span></div>
      <div class="dice-btn" id="btn-p1" onclick="rollDice(1)">
        <span id="dice-val-1">1</span>
      </div>
    </div>
  </div>

  <!-- প্লেয়ার ৩ ও ৪ -->
  <div class="bottom-players">
    <div class="player-slot slot-2" id="slot-p2" style="display:none;">
      <div class="p-header"><span class="color-dot p-2"></span><span class="p-name p3-c">প্লেয়ার ৩</span></div>
      <div class="dice-btn" id="btn-p2" onclick="rollDice(2)">
        <span id="dice-val-2">1</span>
      </div>
    </div>

    <div class="player-slot slot-3" id="slot-p3" style="display:none;">
      <div class="p-header"><span class="color-dot p-3"></span><span class="p-name p4-c">প্লেয়ার ৪</span></div>
      <div class="dice-btn" id="btn-p3" onclick="rollDice(3)">
        <span id="dice-val-3">1</span>
      </div>
    </div>
  </div>

  <h2 id="turn-text">প্লেয়ার ১-এর দান (ছক্কা মারুন)</h2>

  <script src="script.js"></script>
</body>
</html>
