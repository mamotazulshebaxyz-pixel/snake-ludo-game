<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>সাপ - সিঁড়ি</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>সাপ - সিঁড়ি</h1>
  
  <div class="setup">
    <label>প্লেয়ার সংখ্যা: </label>
    <select id="player-count" onchange="resetGame()">
      <option value="2">২ জন</option>
      <option value="3">৩ জন</option>
      <option value="4" selected>৪ জন</option>
    </select>
  </div>

  <div class="game-area">
    <!-- প্লেয়ার ১ এর হোম ইয়ার্ড ও ছক্কা (উপরে-বামে) -->
    <div class="player-corner corner-0">
      <div class="home-yard p-0-bg">
        <div class="yard-circle p-0"></div><div class="yard-circle p-0"></div>
        <div class="yard-circle p-0"></div><div class="yard-circle p-0"></div>
      </div>
      <div class="player-slot slot-0">
        <span class="p-name p1-c">প্লেয়ার ১ <span id="rank-0" class="rank-badge"></span></span>
        <div class="dice-container" id="dice-btn-0" onclick="rollDice(0)">
          <div class="dice" id="dice-0">
            <div class="face f1"><span></span></div>
            <div class="face f2"><span></span><span></span></div>
            <div class="face f3"><span></span><span></span><span></span></div>
            <div class="face f4"><div class="col"><span></span><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f5"><div class="col"><span></span><span></span></div><div class="col"><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f6"><div class="col"><span></span><span></span><span></span></div><div class="col"><span></span><span></span><span></span></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- প্লেয়ার ২ এর হোম ইয়ার্ড ও ছক্কা (উপরে-ডানে) -->
    <div class="player-corner corner-1">
      <div class="home-yard p-1-bg">
        <div class="yard-circle p-1"></div><div class="yard-circle p-1"></div>
        <div class="yard-circle p-1"></div><div class="yard-circle p-1"></div>
      </div>
      <div class="player-slot slot-1">
        <span class="p-name p2-c">প্লেয়ার ২ <span id="rank-1" class="rank-badge"></span></span>
        <div class="dice-container" id="dice-btn-1" onclick="rollDice(1)">
          <div class="dice" id="dice-1">
            <div class="face f1"><span></span></div>
            <div class="face f2"><span></span><span></span></div>
            <div class="face f3"><span></span><span></span><span></span></div>
            <div class="face f4"><div class="col"><span></span><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f5"><div class="col"><span></span><span></span></div><div class="col"><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f6"><div class="col"><span></span><span></span><span></span></div><div class="col"><span></span><span></span><span></span></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- বোর্ড -->
    <div class="board-container">
      <div id="board"></div>
      <svg id="svg-layer"></svg>
      <div id="players-layer"></div>
    </div>

    <!-- প্লেয়ার ৩ এর হোম ইয়ার্ড ও ছক্কা (নিচে-বামে) -->
    <div class="player-corner corner-2" id="corner-p2">
      <div class="home-yard p-2-bg">
        <div class="yard-circle p-2"></div><div class="yard-circle p-2"></div>
        <div class="yard-circle p-2"></div><div class="yard-circle p-2"></div>
      </div>
      <div class="player-slot slot-2">
        <span class="p-name p3-c">প্লেয়ার ৩ <span id="rank-2" class="rank-badge"></span></span>
        <div class="dice-container" id="dice-btn-2" onclick="rollDice(2)">
          <div class="dice" id="dice-2">
            <div class="face f1"><span></span></div>
            <div class="face f2"><span></span><span></span></div>
            <div class="face f3"><span></span><span></span><span></span></div>
            <div class="face f4"><div class="col"><span></span><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f5"><div class="col"><span></span><span></span></div><div class="col"><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f6"><div class="col"><span></span><span></span><span></span></div><div class="col"><span></span><span></span><span></span></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- প্লেয়ার ৪ এর হোম ইয়ার্ড ও ছক্কা (নিচে-ডানে) -->
    <div class="player-corner corner-3" id="corner-p3">
      <div class="home-yard p-3-bg">
        <div class="yard-circle p-3"></div><div class="yard-circle p-3"></div>
        <div class="yard-circle p-3"></div><div class="yard-circle p-3"></div>
      </div>
      <div class="player-slot slot-3">
        <span class="p-name p4-c">প্লেয়ার ৪ <span id="rank-3" class="rank-badge"></span></span>
        <div class="dice-container" id="dice-btn-3" onclick="rollDice(3)">
          <div class="dice" id="dice-3">
            <div class="face f1"><span></span></div>
            <div class="face f2"><span></span><span></span></div>
            <div class="face f3"><span></span><span></span><span></span></div>
            <div class="face f4"><div class="col"><span></span><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f5"><div class="col"><span></span><span></span></div><div class="col"><span></span></div><div class="col"><span></span><span></span></div></div>
            <div class="face f6"><div class="col"><span></span><span></span><span></span></div><div class="col"><span></span><span></span><span></span></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2 id="turn-text">প্লেয়ার ১-এর দান (ছক্কা মারুন)</h2>

  <script src="script.js"></script>
</body>
</html>
